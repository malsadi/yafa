name: CI

on:
  push:

jobs:
  verify:
    name: Lint, typecheck, tests, permission sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The progress record checks read every pushed commit (D-060).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Every pushed commit changed both "Now" lines (D-060)
        run: npm run --silent check:now-lines -- "${{ github.event.before }}" "${{ github.sha }}"

      - name: Every pushed commit that changed code moved the phase summary (D-060)
        run: npm run --silent check:summary-moves -- "${{ github.event.before }}" "${{ github.sha }}"

      - name: Generate Worker types
        run: npm run types

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Permission sweep
        run: npm run test:permissions

  # D-007: deploy the preview on main, only after every check passes. Needs
  # three GitHub secrets set by the owner (phase-00 report, section 6):
  # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and VITE_CLERK_PUBLISHABLE_KEY.
  # The Worker's own secrets are set once with `wrangler secret`, never here.
  deploy-preview:
    name: Deploy preview
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the preview database
        run: npm run db:migrate:preview

      - name: Build and deploy the preview Worker
        run: npm run deploy:preview

      # D-060: prove what a visitor sees is this commit's page, not the repo's.
      - name: The live progress pages are exactly this commit's
        run: npm run --silent check:live-page -- "$PREVIEW_URL"
        env:
          PREVIEW_URL: https://yafa-portal-preview.mohammedalsadi985.workers.dev
