name: CI

on:
  push:

jobs:
  verify:
    name: Lint, typecheck, tests, permission sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Worker types
        run: npm run types

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Permission sweep
        run: npm run test:permissions

  # D-007: deploy the preview on main, only after every check passes. Needs
  # three GitHub secrets set by the owner (phase-00 report, section 6):
  # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and VITE_CLERK_PUBLISHABLE_KEY.
  # The Worker's own secrets are set once with `wrangler secret`, never here.
  deploy-preview:
    name: Deploy preview
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the preview database
        run: npm run db:migrate:preview

      - name: Build and deploy the preview Worker
        run: npm run deploy:preview
